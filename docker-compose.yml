services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ufc
      POSTGRES_PASSWORD: ufc
      POSTGRES_DB: ufc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ufc -d ufc"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
